<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Timezone Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Global Timezone Clock</h1>
        <div class="clock-grid">
            <div class="clock-card" data-timezone="America/New_York">
                <div class="timezone-label">New York (EST)</div>
                <div class="clock">00:00:00</div>
            </div>
            <div class="clock-card" data-timezone="Europe/London">
                <div class="timezone-label">London (GMT)</div>
                <div class="clock">00:00:00</div>
            </div>
            <div class="clock-card" data-timezone="Europe/Paris">
                <div class="timezone-label">Paris (CET)</div>
                <div class="clock">00:00:00</div>
            </div>
            <div class="clock-card" data-timezone="Asia/Tokyo">
                <div class="timezone-label">Tokyo (JST)</div>
                <div class="clock">00:00:00</div>
            </div>
            <div class="clock-card" data-timezone="Australia/Sydney">
                <div class="timezone-label">Sydney (AEDT)</div>
                <div class="clock">00:00:00</div>
            </div>
            <div class="clock-card" data-timezone="Asia/Dubai">
                <div class="timezone-label">Dubai (GST)</div>
                <div class="clock">00:00:00</div>
            </div>
            <div class="clock-card" data-timezone="Asia/Shanghai">
                <div class="timezone-label">Shanghai (CST)</div>
                <div class="clock">00:00:00</div>
            </div>
            <div class="clock-card" data-timezone="America/Los_Angeles">
                <div class="timezone-label">Los Angeles (PST)</div>
                <div class="clock">00:00:00</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
